# renovate-auto-review config — copy to ~/.config/renovate-auto-review/config.toml and edit.
# If XDG_CONFIG_HOME is set, $XDG_CONFIG_HOME/renovate-auto-review/config.toml takes precedence.
#
# Target repository is specified on the command line, e.g.:
#   renovate-auto-review Cassin01/multi_agent_control_tower

# Value passed to "gh pr list --limit" (optional)
limit = 50

# Optional: appended to every Claude prompt as "[Additional instructions]".
# Use to override output language, tone, or add project-specific constraints.
# custom_prompt = "Write the PR comment body in Japanese."

# Domain guard: only operate on repositories owned by these GitHub users/orgs.
# Matched case-insensitively against the "owner" part of the "owner/name"
# argument. Empty or unset = guard disabled (any owner allowed).
# allowed_owners = ["Cassin01", "my-org"]

# Private dependency registries: there is no config key for tokens by design.
# Export the token in your shell before running (e.g. NODE_AUTH_TOKEN / NPM_TOKEN
# / NPM_CONFIG_*). It is forwarded only to the verification phase and stripped
# before commit/push. The target repo's .npmrc must use ${NODE_AUTH_TOKEN}.
