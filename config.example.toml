# renovate-auto-review config — copy to ~/.config/renovate-auto-review/config.toml and edit.
# XDG_CONFIG_HOME が設定されていれば $XDG_CONFIG_HOME/renovate-auto-review/config.toml が優先される。

# gh pr list --limit に渡す値 (省略可)
limit = 50

# 対象 GitHub リポジトリ (owner/name)
repos = [
